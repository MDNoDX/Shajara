{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Delete" %}{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card">
  <h1>{% translate "Are you sure you want to delete this?" %}</h1>
  <p><b>{{ object_name }}</b></p>
  <p class="muted">{% translate "This cannot be undone." %}</p>
  <form method="post">{% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">{% translate "Yes, delete" %}</button>
      <a class="btn btn-ghost" href="{{ cancel_url }}">{% translate "Cancel" %}</a>
    </div>
  </form>
</div></div>
{% endblock %}
