{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card" style="text-align:center">
  <h1>{% translate "Could not sign in with Google" %}</h1>
  <p class="muted">{% translate "Something went wrong while signing in. Please try again." %}</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">{% translate "Back to sign in" %}</a>
</div></div>
{% endblock %}
