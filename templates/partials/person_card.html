<a class="pcard" href="{{ person.get_absolute_url }}">
  {% include "partials/avatar.html" with person=person size="" branch=branch %}
  <span class="who">
    <span class="name">{{ person.short_name }}</span>
    {% if person.lifespan %}<span class="meta">{{ person.lifespan }}</span>{% endif %}
    {% if label %}<br><span class="rel">{{ label }}</span>{% endif %}
  </span>
</a>
