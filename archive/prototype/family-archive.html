<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oilaviy arxiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --surface-2:#F6F7F5; --ink:#1B2427; --muted:#5A666A; --faint:#8A9598;
  --line:#D5DAD8; --line-strong:#B7BFBC;
  --accent:#2C6A60; --accent-ink:#FFFFFF; --accent-soft:#DDEBE7;
  --brass:#86652A; --brass-soft:#F1E8D4; --brick:#9E3727; --brick-soft:#F5E1DC; --slate:#465A7C; --slate-soft:#E2E7F0;
  --grey-soft:#E8EBEA;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:6px; --rail:232px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12181A; --surface:#1A2225; --surface-2:#1F282B; --ink:#E4E9E7; --muted:#A0ACAF; --faint:#77858A;
  --line:#2C373A; --line-strong:#3E4B4F;
  --accent:#72B5A8; --accent-ink:#0E1F1C; --accent-soft:#1F3A35;
  --brass:#CFA965; --brass-soft:#3A301D; --brick:#E68572; --brick-soft:#40231D; --slate:#9FB2D6; --slate-soft:#253046; --grey-soft:#262F32;
}}
:root[data-theme="dark"]{
  --bg:#12181A; --surface:#1A2225; --surface-2:#1F282B; --ink:#E4E9E7; --muted:#A0ACAF; --faint:#77858A;
  --line:#2C373A; --line-strong:#3E4B4F;
  --accent:#72B5A8; --accent-ink:#0E1F1C; --accent-soft:#1F3A35;
  --brass:#CFA965; --brass-soft:#3A301D; --brick:#E68572; --brick-soft:#40231D; --slate:#9FB2D6; --slate-soft:#253046; --grey-soft:#262F32;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{max-width:100%}

/* ---------- Shell ---------- */
#app{display:grid; grid-template-columns:var(--rail) 1fr; height:100%}
.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 14px 16px; overflow-y:auto}
.brand{display:flex; gap:10px; align-items:center; padding:0 8px 18px}
.brand svg{flex:none}
.brand b{font:600 17px/1.15 var(--serif); letter-spacing:.01em; display:block}
.brand small{color:var(--muted); font-size:12px}
.ws{border:1px solid var(--line); border-radius:var(--r); padding:4px; display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:0 4px 18px}
.ws button{border:0; background:none; padding:7px 6px; border-radius:4px; font-size:12.5px; cursor:pointer; color:var(--muted)}
.ws button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
nav.main{display:flex; flex-direction:column; gap:1px}
nav.main button{display:flex; align-items:center; gap:11px; border:0; background:none; text-align:left; padding:9px 10px; border-radius:var(--r); cursor:pointer; color:var(--ink); font-size:14.5px}
nav.main button svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.5; flex:none; opacity:.75}
nav.main button:hover{background:var(--surface-2)}
nav.main button[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
nav.main button[aria-current="page"] svg{opacity:1}
.navlater{margin:18px 8px 0; padding-top:14px; border-top:1px solid var(--line); color:var(--faint); font-size:12.5px; line-height:1.5}
.navlater b{color:var(--muted); font-weight:600; display:block; margin-bottom:4px}
.savestate{margin-top:auto; padding:14px 8px 0; font-size:12.5px; color:var(--muted); display:flex; gap:8px; align-items:flex-start}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--accent); margin-top:6px; flex:none}
.savestate.busy .dot{background:var(--brass)} .savestate.err .dot{background:var(--brick)} .savestate.demo .dot{background:var(--slate)}
main{overflow-y:auto; min-width:0; position:relative}
.topbar{display:none}
.demo-banner{background:var(--slate-soft); color:var(--ink); border-bottom:1px solid var(--line); padding:9px 28px; font-size:13.5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.demo-banner strong{font-weight:700; letter-spacing:.04em; color:var(--slate)}
.page{max-width:1180px; padding:32px 40px 64px; margin:0 auto}
.page.narrow{max-width:900px}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.2; margin:0}
h1{font-size:34px; letter-spacing:-.005em}
h2{font-size:22px}
h3{font-size:17px}
.lede{color:var(--muted); margin:6px 0 0; max-width:64ch}
.head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:28px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line-strong); background:var(--surface); padding:7px 13px; border-radius:var(--r); cursor:pointer; font-size:14px; line-height:1.3; white-space:nowrap; text-decoration:none; color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--brick); border-color:var(--brick)}
.btn.ghost{border-color:transparent; background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{text-align:left; border:0; background:none; padding:0; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; font-size:inherit}

/* ---------- Evidence status ---------- */
.st{display:inline-flex; align-items:center; gap:5px; font-size:12px; line-height:1; padding:4px 7px 4px 6px; border-radius:3px; white-space:nowrap; font-weight:500; border:1px solid transparent}
.st i{font-style:normal; font-weight:700; font-size:11px; width:12px; text-align:center}
.st-verified{background:var(--accent-soft); color:var(--accent)}
.st-probable{background:var(--slate-soft); color:var(--slate)}
.st-family_tradition{background:var(--brass-soft); color:var(--brass)}
.st-unverified{background:var(--grey-soft); color:var(--muted); border-color:var(--line-strong); border-style:dashed}
.st-contradicted, .st-conflict{background:var(--brick-soft); color:var(--brick)}
.tag{display:inline-block; font-size:12px; padding:2px 7px; border-radius:3px; background:var(--grey-soft); color:var(--muted)}
.unknown{color:var(--faint); font-style:italic}

/* ---------- Dashboard ---------- */
.dash{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:28px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px}
.panel > h2, .panel > h3{margin-bottom:12px}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px}
.ledger{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); margin-top:4px}
.ledger div{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:12px 14px}
.ledger b{display:block; font:600 26px/1.1 var(--serif)}
.ledger span{font-size:12.5px; color:var(--muted)}
.minitree{height:300px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface-2); cursor:pointer; overflow:hidden; display:block; width:100%; padding:0}
.minitree svg{width:100%; height:100%; display:block}
.gaps{list-style:none; margin:0; padding:0}
.gaps > li{border-top:1px solid var(--line); padding:10px 0}
.gaps > li:first-child{border-top:0; padding-top:0}
.gaps summary{cursor:pointer; list-style:none; display:flex; gap:10px; align-items:baseline}
.gaps summary::-webkit-details-marker{display:none}
.gaps summary::before{content:"▸"; color:var(--faint); font-size:11px; width:10px}
.gaps details[open] summary::before{content:"▾"}
.gaps .n{font:600 18px/1 var(--serif); min-width:26px}
.gaps ul{margin:8px 0 2px 36px; padding:0; list-style:none; font-size:13.5px}
.gaps ul li{padding:2px 0}
.gaps .ok{color:var(--muted); font-size:14px}
.recent{list-style:none; padding:0; margin:0}
.recent li{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:14px}
.recent li:first-child{border-top:0}

/* ---------- People list ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.search{flex:1 1 260px; max-width:420px; position:relative}
.search input{width:100%; padding:8px 12px 8px 34px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface)}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:1.8}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.seg button{border:0; border-right:1px solid var(--line); background:none; padding:7px 12px; cursor:pointer; font-size:13.5px; color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
table.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl th{text-align:left; font-weight:600; font-size:12.5px; color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap}
.tbl td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.pname{font:600 16px/1.3 var(--serif)}
.alt{font-size:12.5px; color:var(--muted)}

/* ---------- Profile ---------- */
.prof-head{display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:start; margin-bottom:28px; padding-bottom:26px; border-bottom:1px solid var(--line)}
.seal{width:84px; height:84px; border-radius:50%; display:grid; place-items:center; font:600 28px/1 var(--serif); background:var(--surface); border:1px solid var(--line-strong); color:var(--muted); position:relative}
.seal::after{content:""; position:absolute; inset:5px; border-radius:50%; border:1px dashed var(--line-strong)}
.prof-head h1{font-size:38px}
.lifespan{font:400 19px/1.3 var(--serif); color:var(--muted); margin-top:4px}
.names-alt{margin-top:8px; font-size:13.5px; color:var(--muted)}
.prof-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.prof-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px}
.section{margin-bottom:30px}
.section > .sh{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:12px; gap:10px}
.facts{display:grid; grid-template-columns:max-content 1fr; gap:10px 18px; margin:0}
.facts dt{color:var(--muted); font-size:13.5px; padding-top:1px}
.facts dd{margin:0}
.fam{list-style:none; padding:0; margin:0}
.fam li{display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line)}
.fam li:first-child{border-top:0}
.fam .who{min-width:0}
.fam .who button.link{font:600 15.5px/1.3 var(--serif); text-decoration:none; color:var(--ink)}
.fam .who button.link:hover{text-decoration:underline}
.fam .meta{font-size:12.5px; color:var(--muted)}
.famgroup{font-size:12.5px; color:var(--muted); margin:14px 0 2px; font-weight:600}
.famgroup:first-child{margin-top:0}
.events{list-style:none; margin:0; padding:0; border-left:1px solid var(--line-strong); margin-left:6px}
.events li{position:relative; padding:0 0 16px 20px}
.events li::before{content:""; position:absolute; left:-5px; top:7px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:1.5px solid var(--accent)}
.events .when{font:600 14px/1.3 var(--sans)}
.events .what{font:600 16px/1.35 var(--serif)}
.events .cite{font-size:12.5px; color:var(--muted); margin-top:3px}
.conflict{border:1px solid var(--brick); background:var(--brick-soft); border-radius:var(--r); padding:16px 18px; margin-bottom:24px}
.conflict h3{color:var(--brick); display:flex; gap:8px; align-items:center}
.conflict .alts{display:grid; gap:10px; margin:12px 0}
.conflict .alt-rec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap}
.conflict.resolved{border-color:var(--line-strong); background:var(--surface)}
.conflict.resolved h3{color:var(--ink)}
.note{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; font-size:14px; white-space:pre-wrap}

/* ---------- Sources ---------- */
.srcs{display:grid; gap:12px}
.src{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px}
.src h3{margin-bottom:4px}
.src details{margin-top:8px; font-size:13.5px}
.src details ul{margin:6px 0 0; padding-left:18px}

/* ---------- Tree ---------- */
.tree-page{display:flex; flex-direction:column; height:100%}
.tree-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface)}
.tree-bar .grow{flex:1}
.tree-bar label.inl{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted)}
.tree-bar select, .tree-bar input{padding:6px 8px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface); font-size:13.5px; max-width:220px}
.canvas-wrap{position:relative; flex:1; min-height:360px; overflow:hidden; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.2px) 0 0/22px 22px, var(--bg)}
#treeSvg{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#treeSvg.dragging{cursor:grabbing}
.zoomctl{position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden}
.zoomctl button{border:0; border-bottom:1px solid var(--line); background:none; width:38px; height:36px; cursor:pointer; font-size:17px}
.zoomctl button:last-child{border-bottom:0; font-size:12px}
.legend{position:absolute; left:16px; bottom:16px; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r); padding:10px 14px; font-size:12.5px; max-width:300px}
.legend ul{list-style:none; margin:6px 0 0; padding:0; display:grid; gap:4px}
.legend li{display:flex; gap:10px; align-items:center}
.legend svg{flex:none}
.legend.hidden{display:none}
.empty-tree{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:30px}

/* SVG tree elements — colors via CSS vars (export inlines light values) */
.t-card rect.bg{fill:var(--surface); stroke:var(--line-strong); stroke-width:1}
.t-card.focus rect.bg{stroke:var(--accent); stroke-width:2.5}
.t-card.hl rect.bg{stroke:var(--brass); stroke-width:3}
.t-card:hover rect.bg{stroke:var(--accent)}
.t-card:focus{outline:none}
.t-card:focus-visible rect.bg{stroke:var(--accent); stroke-width:3}
.t-card{cursor:pointer}
.t-card .mono{fill:var(--surface-2); stroke:var(--line-strong)}
.t-card .mono-t{fill:var(--muted); font:600 15px var(--serif); text-anchor:middle; dominant-baseline:central}
.t-card .nm{fill:var(--ink); font:600 14.5px var(--serif)}
.t-card .yr{fill:var(--muted); font:400 12.5px var(--sans)}
.t-card .lb{fill:var(--accent); font:500 11.5px var(--sans)}
.t-card .warn{fill:var(--brick); font:700 12px var(--sans)}
.t-card.dup rect.bg, .t-card.ghost rect.bg{fill:none; stroke-dasharray:5 4}
.t-card.ghost .nm{fill:var(--muted); font-style:italic; font-weight:400}
.t-card.living .stripe{fill:var(--accent)} .t-card .stripe{fill:var(--line-strong)}
.t-edge{fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.6}
.t-edge.adopt{stroke-dasharray:8 5}
.t-edge.step, .t-edge.guardian, .t-edge.foster{stroke-dasharray:3 4}
.t-edge.doubt{stroke-opacity:.35; stroke-dasharray:1.5 4; stroke-linecap:round}
.t-couple{fill:none; stroke:var(--ink); stroke-opacity:.6; stroke-width:1.6}
.t-couple.partnership{stroke-dasharray:6 4}
.t-couple.doubt{stroke-opacity:.35; stroke-dasharray:1.5 4}
.t-ulabel{fill:var(--muted); font:400 11px var(--sans); text-anchor:middle}
.t-elabel{fill:var(--muted); font:italic 400 11px var(--sans)}
.t-tog circle{fill:var(--surface); stroke:var(--line-strong)}
.t-tog text{fill:var(--ink); font:600 12px var(--sans); text-anchor:middle; dominant-baseline:central}
.t-tog{cursor:pointer}
.t-tog:hover circle{stroke:var(--accent)}
svg.far .yr, svg.far .lb, svg.far .t-ulabel, svg.far .t-elabel{display:none}

/* ---------- Modal & forms ---------- */
.scrim{position:fixed; inset:0; background:rgba(12,18,20,.48); display:grid; place-items:center; padding:20px; z-index:50}
.modal{background:var(--surface); border-radius:8px; width:min(760px,100%); max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{width:min(480px,100%)}
.modal header{flex:none; padding:20px 24px 12px; display:flex; justify-content:space-between; gap:12px; align-items:start; border-bottom:1px solid var(--line)}
.modal header p{margin:4px 0 0; color:var(--muted); font-size:13.5px}
.modal .body{padding:18px 24px; overflow-y:auto; min-height:0; flex:1 1 auto}
.modal footer{flex:none; padding:14px 24px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}
.modal footer .row{margin-left:auto}
.xbtn{border:0; background:none; font-size:22px; line-height:1; cursor:pointer; color:var(--muted); padding:2px 6px}
fieldset{border:0; margin:0 0 22px; padding:0}
legend{font:600 18px/1.3 var(--serif); margin-bottom:4px; padding:0}
.hint{color:var(--muted); font-size:13px; margin:0 0 10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.fld{display:flex; flex-direction:column; gap:4px; min-width:0}
.fld > span{font-size:12.5px; color:var(--muted); font-weight:500}
.fld input, .fld select, .fld textarea, .fdate input, .fdate select, .cites select, .cites input{padding:7px 9px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface); width:100%; min-width:0}
.fld textarea{min-height:84px; resize:vertical}
.err{color:var(--brick); font-size:13.5px; margin:8px 0 0; font-weight:500}
.fdate{display:grid; grid-template-columns:150px 70px 1fr 90px; gap:8px; align-items:center}
.fdate .two{display:contents}
.fdate .and{font-size:12.5px; color:var(--muted); grid-column:1; text-align:right}
.fdate .txt{grid-column:1 / -1}
.fdate.m-unknown .p1, .fdate.m-unknown .two{display:none}
.fdate:not(.m-between) .two{display:none}
.fdate.m-year .dd, .fdate.m-year .mm, .fdate.m-month .dd{visibility:hidden}
.namerow{border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-bottom:10px; background:var(--surface-2)}
.namerow .grid3{margin-top:8px}
.cites{display:grid; gap:8px}
.cite-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px}
.cite-new{grid-column:1 / -1; display:grid; grid-template-columns:2fr 1fr; gap:8px}
.choice{display:flex; gap:8px; flex-wrap:wrap}
.choice label{display:flex; gap:7px; align-items:center; border:1px solid var(--line-strong); border-radius:var(--r); padding:7px 12px; cursor:pointer; font-size:14px}

"use strict";
/* =====================================================================
   CORE — vocabulary, fuzzy dates, store, backends, queries, evidence
   ===================================================================== */
const KINDS = ["people","events","rels","sources","places","branches","meta"];
const STATUS = {
  verified:{label:"Verified", icon:"✓", help:"Supported by a reliable source."},
  probable:{label:"Probable", icon:"◐", help:"Strong evidence, not fully verified."},
  family_tradition:{label:"Family tradition", icon:"❝", help:"Passed down orally in the family."},
  unverified:{label:"Unverified", icon:"?", help:"Claimed but not yet supported."},
  contradicted:{label:"Contradicted", icon:"!", help:"Sources disagree about this."}
};
const STATUS_RANK = {verified:4, probable:3, family_tradition:2, unverified:1, contradicted:0};
const PC_NATURE = {biological:"Biological", adoptive:"Adoptive", step:"Step", guardian:"Guardian", foster:"Foster", unknown:"Unknown / not stated"};
const UNION_TYPE = {marriage:"Marriage", religious_marriage:"Religious marriage (nikoh)", civil_partnership:"Civil partnership", partnership:"Partnership (unmarried)", unknown:"Unknown"};
const UNION_END = {"":"Still together / not ended", divorce:"Divorce", annulment:"Annulment", death:"Death of a partner", separation:"Separation", unknown:"Ended — reason unknown"};
const EVENT_TYPES = {birth:"Birth", death:"Death", burial:"Burial", education:"Education", employment:"Employment / occupation", military:"Military service", migration:"Migration / move", residence:"Residence", religious:"Religious event", achievement:"Achievement", travel:"Travel", family_event:"Family event", other:"Other"};
const SINGULAR = ["birth","death","burial"]; // types where >1 incompatible record = conflict
const NAME_TYPES = {birth:"Birth name", married:"Married name", former:"Former name", nickname:"Nickname", alternative:"Alternative spelling", historical:"Historical spelling", local_language:"Local-language form", arabic_script:"Arabic-script form", cyrillic:"Cyrillic / Russian form", other:"Other"};
const SCRIPTS = {Latn:"Latin", Cyrl:"Cyrillic", Arab:"Arabic", other:"Other"};
const SOURCE_TYPES = {official_document:"Official document", certificate:"Certificate", book:"Book", archive_record:"Archive record", website:"Website", interview:"Interview", family_member:"Family member (oral)", photograph:"Photograph", letter:"Letter", newspaper:"Newspaper", other:"Other"};
const PRIVACY = {private:"Private — only you", family:"Family — trusted family members", public:"Public — anyone with access"};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DATE_MODES = {unknown:"Unknown", exact:"Exact date", month:"Month and year", year:"Year only", about:"About (circa)", before:"Before", after:"After", between:"Between"};

/* ---------- utilities ---------- */
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO = () => new Date().toISOString();
const clone = (o) => JSON.parse(JSON.stringify(o));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const fold = (s) => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[ʻʼ'`‘’]/g,"");

/* ---------- fuzzy dates ----------
   {mode, y, m, d, y2, m2, d2, text}  — never forced to exact */
function one(y,m,d){ if(!y) return "?"; if(d && m) return `${d} ${MON[m-1]} ${y}`; if(m) return `${MON[m-1]} ${y}`; return `${y}`; }
function fmtDate(dt){
  if(!dt || !dt.mode || dt.mode==="unknown") return "";
  if(LANG==="uz") return fmtDateUz(dt);
  const a = one(dt.y,dt.m,dt.d);
  switch(dt.mode){
    case "exact": case "month": case "year": return a;
    case "about": return "c. " + a;
    case "before": return "before " + a;
    case "after": return "after " + a;
    case "between": return `between ${a} and ${one(dt.y2,dt.m2,dt.d2)}`;
  }
  return "";
}
function yearLabel(dt){
  if(!dt || !dt.mode || dt.mode==="unknown" || !dt.y) return null;
  if(LANG==="uz") return yearLabelUz(dt);
  switch(dt.mode){
    case "about": return "c." + dt.y;
    case "before": return "bef." + dt.y;
    case "after": return "aft." + dt.y;
    case "between": return dt.y===dt.y2 ? `${dt.y}` : `${dt.y}–${dt.y2}`;
    default: return `${dt.y}`;
  }
}
function dRange(dt){ // inclusive year range the claim allows; null if unknown
  if(!dt || !dt.mode || dt.mode==="unknown" || !dt.y) return null;
  switch(dt.mode){
    case "about": return [dt.y-2, dt.y+2];
    case "before": return [-Infinity, dt.y];
    case "after": return [dt.y, Infinity];
    case "between": return [dt.y, dt.y2||dt.y];
    default: return [dt.y, dt.y];
  }
}
function dSort(dt){ if(!dt || !dt.y || dt.mode==="unknown") return null; return dt.y*10000 + (dt.m||0)*100 + (dt.d||0); }
function dateCompatible(a,b){
  const ra=dRange(a), rb=dRange(b); if(!ra||!rb) return true;
  if(ra[1] < rb[0] || rb[1] < ra[0]) return false;
  if(a.mode==="exact" && b.mode==="exact" && (a.m!==b.m || a.d!==b.d)) return false;
  return true;
}
function validateDate(dt){
  if(!dt || dt.mode==="unknown") return null;
  const chk=(y,m,d,label)=>{
    if(!y || y<1000 || y>2100) return t("{label}: enter a four-digit year between 1000 and 2100.",{label:t(label)});
    if(m && (m<1||m>12)) return t("{label}: month must be 1–12.",{label:t(label)});
    if(d){ if(!m) return t("{label}: choose a month for the day.",{label:t(label)}); const max=new Date(y,m,0).getDate(); if(d<1||d>max) return t("{label}: {month} {y} has {max} days.",{label:t(label), month:MON[m-1], y, max}); }
    return null;
  };
  let e = chk(dt.y, dt.mode==="year"?null:dt.m, ["exact","about","before","after","between"].includes(dt.mode)?dt.d:null, "Date"); if(e) return e;
  if(dt.mode==="exact" && (!dt.m || !dt.d)) return t("Exact date needs day, month and year — or choose “Month and year” or “Year only”.");
  if(dt.mode==="month" && !dt.m) return t("Choose a month, or switch to “Year only”.");
  if(dt.mode==="between"){ e=chk(dt.y2,dt.m2,dt.d2,"End date"); if(e) return e; if((dSort({y:dt.y2,m:dt.m2,d:dt.d2,mode:"exact"})||0) < (dSort({...dt,mode:"exact"})||0)) return t("The end of the range is earlier than the start."); }
  const yNow = new Date().getFullYear(); if(dt.y > yNow+1) return t("That year is in the future.");
  return null;
}

/* ---------- state ---------- */
const empty = () => Object.fromEntries(KINDS.map(k=>[k,{}]));
let S = empty();
const P = (id) => S.people[id];

/* ---------- backends ----------
   memory (demo) · db (private per-user subtree on claude.ai) · local (browser) */
const MemoryBackend = (label) => ({ kind:"memory", label, async load(){ return null; }, async put(){}, async del(){}, async wipe(){} });

function LocalBackend(key){
  const KEY = key || "family-archive:mine:v1";
  const read = () => { try{ const v = localStorage.getItem(KEY); return v? JSON.parse(v) : null; }catch(e){ return null; } };
  const write = (o) => { localStorage.setItem(KEY, JSON.stringify(o)); };
  return {
    kind:"local", label:"Saved in this browser only — download a backup regularly",
    async load(){ const o = read() || empty(); KINDS.forEach(k=>{ o[k] = o[k] || {}; }); return o; },
    async put(k,obj){ const o = read() || empty(); o[k] = o[k]||{}; o[k][obj.id] = obj; write(o); },
    async del(k,id){ const o = read() || empty(); if(o[k]) delete o[k][id]; write(o); },
    async wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  };
}
/* db: the viewer's private subtree on claude.ai — data/users/<me>/<root>/<kind>/<id> */
function DbBackend(db, me, rootName){
  const root = db.doc(`data/users/${me}/${rootName}`);
  const col = (k) => root.collection(k);
  return {
    kind:"db", label:"Saved to your private space on claude.ai",
    async load(){
      const out = empty(); let truncated = false;
      for(const k of KINDS){
        const snap = await col(k).limit(1000).get();
        if(snap.docs.length === 1000) truncated = true;
        snap.docs.forEach(d=>{ const v = d.data(); if(v && v.id) out[k][v.id] = v; });
      }
      out.__truncated = truncated; return out;
    },
    async hasData(){ const snap = await col("people").limit(1).get(); return snap.docs.length > 0; },
    async put(k,obj){ await col(k).doc(obj.id).set(clone(obj)); },
    async del(k,id){ await col(k).doc(id).delete(); },
    async wipe(cur){ for(const k of KINDS) for(const id of Object.keys(cur[k]||{})) await col(k).doc(id).delete(); }
  };
}

/* single write queue: one write at a time, in order */
let writeChain = Promise.resolve(); let pending = 0; let lastError = null;
let backend = MemoryBackend("Demo");
function enqueue(fn){
  pending++; updateSaveState();
  writeChain = writeChain.then(fn).then(()=>{ lastError=null; }).catch(e=>{ lastError = e; console.error(e); })
    .finally(()=>{ pending--; updateSaveState(); });
  return writeChain;
}
function put(kind, obj){
  const t = nowISO(); obj.updated = t; if(!obj.created) obj.created = t;
  S[kind][obj.id] = obj;
  const b = backend; const copy = clone(obj);
  enqueue(()=>b.put(kind, copy));
  return obj;
}
function del(kind, id){ delete S[kind][id]; const b = backend; enqueue(()=>b.del(kind,id)); }

/* ---------- places (entity, found-or-created by name) ---------- */
function placeName(id){ return id && S.places[id] ? S.places[id].name : ""; }
function placeIdFor(name){
  name = String(name||"").trim(); if(!name) return null;
  const hit = Object.values(S.places).find(p=>fold(p.name)===fold(name));
  if(hit) return hit.id;
  return put("places", {id:uid("pl"), name}).id;
}

/* ---------- names ---------- */
function nameText(n){ if(!n) return ""; const parts=[n.given, n.patronymic, n.surname].filter(Boolean).join(" "); return parts || n.full || ""; }
function primaryNameObj(p){ return (p.names||[]).find(n=>n.primary) || (p.names||[])[0]; }
function nameOf(p){ if(!p) return t("Unknown person"); const s = nameText(primaryNameObj(p)); return s || t("Name not recorded"); }
function nameById(id){ return nameOf(P(id)); }
function initials(p){ const n = primaryNameObj(p); if(!n) return "?"; const a=(n.given||n.full||"?")[0]||"?"; const b=(n.surname||"")[0]||""; return (a+b).toUpperCase(); }
function nameVariants(p){ return (p.names||[]).flatMap(n=>[nameText(n), n.full].filter(Boolean)); }

/* ---------- relationships ---------- */
const rels = () => Object.values(S.rels);
function parentsOf(pid){ return rels().filter(r=>r.type==="parentChild" && r.childId===pid && P(r.parentId)).map(r=>({rel:r, person:P(r.parentId)})); }
function childrenOf(pid){ return rels().filter(r=>r.type==="parentChild" && r.parentId===pid && P(r.childId)).map(r=>({rel:r, person:P(r.childId)})); }
function unionsOf(pid){ return rels().filter(r=>r.type==="union" && (r.aId===pid||r.bId===pid)).map(r=>({rel:r, partnerId: r.aId===pid? r.bId : r.aId})).filter(u=>P(u.partnerId)); }
function explicitSiblings(pid){ return rels().filter(r=>r.type==="sibling" && (r.aId===pid||r.bId===pid)).map(r=>({rel:r, id: r.aId===pid? r.bId : r.aId})).filter(s=>P(s.id)); }
function siblingsOf(pid){
  const mine = parentsOf(pid).map(x=>x.person.id); const out = new Map();
  for(const par of mine){
    for(const c of childrenOf(par)){ if(c.person.id===pid) continue;
      const theirs = parentsOf(c.person.id).map(x=>x.person.id);
      const shared = mine.filter(x=>theirs.includes(x));
      let kind;
      if(shared.length>=2) kind="full";
      else if(mine.length>=2 && theirs.length>=2) kind="half";
      else kind="unclear";
      out.set(c.person.id, {id:c.person.id, kind, shared});
    }
  }
  for(const s of explicitSiblings(pid)) if(!out.has(s.id)) out.set(s.id, {id:s.id, kind:"recorded", rel:s.rel});
  return [...out.values()];
}
function isAncestor(a, b){ // is a an ancestor of b?
  const seen=new Set(); const st=[b];
  while(st.length){ const c=st.pop(); for(const {person} of parentsOf(c)){ if(person.id===a) return true; if(!seen.has(person.id)){ seen.add(person.id); st.push(person.id);} } }
  return false;
}

/* ---------- events & evidence ---------- */
const events = () => Object.values(S.events);
function eventsOf(pid){ return events().filter(e=>(e.participants||[]).some(x=>x.personId===pid)); }
function vitalRecords(pid, type){ return events().filter(e=>e.type===type && (e.participants||[]).some(x=>x.personId===pid && x.role==="principal")); }
function recordsCompatible(a,b){
  if(!dateCompatible(a.date,b.date)) return false;
  if(a.placeId && b.placeId && a.placeId!==b.placeId) return false;
  return true;
}
/* Returns {records, conflict:bool, resolution, chosen}
   chosen = the record to DISPLAY as the value, or null when an unresolved conflict exists. */
function vital(pid, type){
  const recs = vitalRecords(pid, type);
  let conflict = false;
  for(let i=0;i<recs.length;i++) for(let j=i+1;j<recs.length;j++) if(!recordsCompatible(recs[i],recs[j])) conflict = true;
  const res = ((P(pid)||{}).resolutions||{})[type];
  const resolved = conflict && res && res.state==="preferred_selected" && recs.some(r=>r.id===res.eventId) ? res : null;
  let chosen = null;
  if(!recs.length) chosen = null;
  else if(conflict) chosen = resolved ? recs.find(r=>r.id===resolved.eventId) : null;
  else chosen = [...recs].sort((a,b)=>(STATUS_RANK[b.status]||0)-(STATUS_RANK[a.status]||0) || specificity(b.date)-specificity(a.date))[0];
  return {records:recs, conflict, resolution:resolved, chosen};
}
function specificity(dt){ return !dt||dt.mode==="unknown"?0 : {exact:6,month:5,year:4,between:3,about:2,before:1,after:1}[dt.mode]||0; }
function yearsLine(p){
  const b = vital(p.id,"birth"), d = vital(p.id,"death");
  const part = (v) => {
    if(v.conflict && !v.chosen){ const ys=[...new Set(v.records.map(r=>yearLabel(r.date)||"?"))]; return {t: ys.join(" / "), conflict:true}; }
    return {t: v.chosen ? (yearLabel(v.chosen.date) || "?") : "?", conflict:false};
  };
  const bb = part(b), dd = part(d);
  let t0;
  if(p.living==="living") t0 = bb.t==="?" ? t("Living") : t("b. {y}",{y:bb.t});
  else if(p.living==="deceased") t0 = `${bb.t} – ${dd.t}`;
  else t0 = (!d.records.length) ? (bb.t==="?" ? t("Dates unknown") : t("b. {y}",{y:bb.t})) : `${bb.t} – ${dd.t}`;
  return {text:t0, conflict: bb.conflict||dd.conflict};
}
function unresolvedConflicts(pid){ return SINGULAR.filter(t=>{ const v=vital(pid,t); return v.conflict && !v.resolution; }); }
function citationsOf(o){ return (o.citations||[]).filter(c=>S.sources[c.sourceId]); }
function allCitingItems(sourceId){
  const out=[];
  for(const e of events()) if((e.citations||[]).some(c=>c.sourceId===sourceId)) out.push({kind:"events", obj:e});
  for(const r of rels()) if((r.citations||[]).some(c=>c.sourceId===sourceId)) out.push({kind:"rels", obj:r});
  return out;
}
function describeEvent(e){
  const who = (e.participants||[]).filter(x=>x.role==="principal").map(x=>nameById(x.personId)).join(", ");
  return who ? t("{type} of {who}",{type:EVENT_TYPES[e.type]||t("Event"), who}) : (EVENT_TYPES[e.type]||t("Event"));
}
function describeRel(r){
  if(r.type==="parentChild") return t("{a} → parent of {b} ({nature})",{a:nameById(r.parentId), b:nameById(r.childId), nature:(PC_NATURE[r.nature]||"").toLowerCase()});
  if(r.type==="union") return `${UNION_TYPE[r.unionType]||t("Union")}: ${nameById(r.aId)} & ${nameById(r.bId)}`;
  return t("Siblings: {a} & {b}",{a:nameById(r.aId), b:nameById(r.bId)});
}

/* ---------- generations ---------- */
function generationInfo(){
  const gen = new Map(); let maxSpan = 0;
  for(const p of Object.values(S.people)){
    if(gen.has(p.id)) continue;
    const comp = new Map([[p.id,0]]); const q=[p.id];
    while(q.length){ const c=q.shift(); const g=comp.get(c);
      for(const x of parentsOf(c)) if(!comp.has(x.person.id)){ comp.set(x.person.id,g-1); q.push(x.person.id); }
      for(const x of childrenOf(c)) if(!comp.has(x.person.id)){ comp.set(x.person.id,g+1); q.push(x.person.id); }
      for(const u of unionsOf(c)) if(!comp.has(u.partnerId)){ comp.set(u.partnerId,g); q.push(u.partnerId); }
    }
    const min = Math.min(...comp.values()), max = Math.max(...comp.values());
    for(const [id,g] of comp) gen.set(id, g-min+1);
    maxSpan = Math.max(maxSpan, max-min+1);
  }
  return {gen, count: Object.keys(S.people).length ? maxSpan : 0};
}

/* ---------- kinship label relative to a focus person ---------- */
function ancDist(pid){ const m=new Map([[pid,0]]); const q=[pid]; while(q.length){ const c=q.shift(); for(const {person} of parentsOf(c)) if(!m.has(person.id)){ m.set(person.id, m.get(c)+1); q.push(person.id);} } return m; }
const gw = (sx, male, female, neutral) => sx==="male"?male : sx==="female"?female : neutral;
function greats(n){ return n<=0 ? "" : n===1 ? "Great-" : n===2 ? "Great-great-" : `${n}× great-`; }
function ordinal(n){ return ["","First","Second","Third","Fourth","Fifth","Sixth"][n] || `${n}th`; }
function bloodLabel(focus, pid){
  if(focus===pid) return "Focus";
  const A=ancDist(focus), B=ancDist(pid); let best=null;
  for(const [id,a] of A) if(B.has(id)){ const b=B.get(id); if(!best || a+b < best.a+best.b) best={a,b}; }
  if(!best) return null;
  const {a,b} = best; const sx = (P(pid)||{}).sex;
  if(b===0){ if(a===1) return gw(sx,"Father","Mother","Parent"); return greats(a-2) + (a-2>0? gw(sx,"grandfather","grandmother","grandparent") : gw(sx,"Grandfather","Grandmother","Grandparent")); }

      const lab = unionLabel(g.union);
      out.labels.push({x: adjacent? g.ux : (u.selfX+CW/2 + px+CW/2)/2, y: adjacent? yl-8 : y-20, t:lab, cls:"t-ulabel"});
    } else {
      out.labels.push({x: adjacent? g.ux : (u.selfX+CW/2 + px+CW/2)/2, y: adjacent? yl-8 : y-20, t:"no union recorded", cls:"t-ulabel"});
    }
  });
  if(u.hasKids) out.toggles.push({pid:u.pid, x:u.selfX + CW/2, y:y+CH+ (u.collapsed? 16 : 0), collapsed:u.collapsed, hidden:u.hidden, only: u.collapsed});
  if(!u.childW) return;
  let cx = x0 + (u.w - u.childW)/2; const cy = y + RH; let first = true;
  u.order.forEach(g=>{
    if(!g.children.length) return;
    if(!first) cx += HG*0.8; first = false;
    const centers = [];
    g.children.forEach(c=>{ placeDesc(c.unit, cx, cy, out); centers.push({x:c.unit.selfX + CW/2, rel:c.rel}); cx += c.unit.w + HG; });
    const barY = cy - VG/2;
    const minX = Math.min(g.ux, ...centers.map(c=>c.x)), maxX = Math.max(g.ux, ...centers.map(c=>c.x));
    out.edges.push({cls:"t-edge", d:`M${g.ux},${g.uy} V${barY}`});
    out.edges.push({cls:"t-edge", d:`M${minX},${barY} H${maxX}`});
    centers.forEach(c=>{
      const nat = c.rel.nature; const cls = ["t-edge", nat==="adoptive"?"adopt": (["step","guardian","foster"].includes(nat)? nat : ""), doubtful(c.rel.status)?"doubt":""].join(" ");
      out.edges.push({cls, d:`M${c.x},${barY} V${cy}`});
      if(nat!=="biological") out.labels.push({x:c.x+6, y:cy-8, t: nat==="unknown" ? t("link type unknown") : PC_NATURE[nat].toLowerCase(), cls:"t-elabel", anchor:"start"});
    });
  });
}

/* ---------- ancestor nodes ---------- */
function ancNode(pid, depth, ctx){
  const n = {pid, parents:[]};
  if(depth<=0) return n;
  const ps = parentsOf(pid);
  let chosen = ps.filter(x=>x.rel.nature==="biological" || x.rel.nature==="unknown");
  if(!chosen.length) chosen = ps;
  chosen = chosen.sort((a,b)=>(a.person.sex==="male"?0:a.person.sex==="female"?1:2)-(b.person.sex==="male"?0:b.person.sex==="female"?1:2)).slice(0,2);
  n.more = ps.length - chosen.length;
  n.parents = chosen.map(x=>{
    if(ctx.seen.has(x.person.id)) return {rel:x.rel, node:{pid:x.person.id, dup:true, parents:[]}};
    ctx.seen.add(x.person.id);
    return {rel:x.rel, node:ancNode(x.person.id, depth-1, ctx)};
  });
  if(ctx.ghosts && n.parents.length<2 && !(P(pid).noParentSearch)){
    const have = n.parents.map(x=>x.node.pid && P(x.node.pid) ? P(x.node.pid).sex : null);
    const need = n.parents.length===0 ? ["male","female"] : [have[0]==="male"?"female":have[0]==="female"?"male":"unknown"];
    need.forEach(sx=>n.parents.push({ghost:true, node:{ghost:true, forPid:pid, sex:sx, parents:[]}}));
  }
  return n;
}
function measureAnc(n){ if(!n.parents.length){ n.w = CW; return CW; } let s = 0; n.parents.forEach(p=>{ s += measureAnc(p.node); }); s += HG*(n.parents.length-1); n.w = Math.max(CW, s); return n.w; }
function placeAnc(n, x0, y, out, skipSelf){
  const x = x0 + (n.w - CW)/2; n.x = x;
  if(!skipSelf){ if(n.ghost) out.nodes.push({ghost:true, forPid:n.forPid, sex:n.sex, x, y}); else out.nodes.push({pid:n.pid, x, y, dup:n.dup}); }
  if(!n.parents.length) return;
  const pw = n.parents.reduce((s,p)=>s+p.node.w,0) + HG*(n.parents.length-1);
  let px = x0 + (n.w - pw)/2; const py = y - RH;
  const pts = [];
  n.parents.forEach(p=>{ placeAnc(p.node, px, py, out); pts.push({x:p.node.x, p}); px += p.node.w + HG; });
  const barY = y - VG/2, cx = x + CW/2;
  // couple line between the two parents when a union is recorded
  if(pts.length===2 && !pts[0].p.ghost && !pts[1].p.ghost){
    const u = unionsOf(pts[0].p.node.pid).find(u=>u.partnerId===pts[1].p.node.pid);
    if(u){
      const a = pts[0].x + CW, b = pts[1].x;
      if(b - a < 400){ out.edges.push({cls:"t-couple "+(doubtful(u.rel.status)?"doubt":""), d:`M${a},${py+CH/2} H${b}`}); out.labels.push({x:(a+b)/2, y:py+CH/2-8, t:unionLabel(u.rel), cls:"t-ulabel"}); }
    }
  }
  pts.forEach(({x:pxx, p})=>{
    const top = pxx + CW/2;
    const nat = p.ghost ? "" : p.rel.nature;
    const cls = p.ghost ? "t-edge doubt" : ["t-edge", nat==="adoptive"?"adopt":(["step","guardian","foster"].includes(nat)?nat:""), doubtful(p.rel.status)?"doubt":""].join(" ");
    out.edges.push({cls, d:`M${top},${py+CH} V${barY} H${cx} V${y}`});
    if(!p.ghost && nat!=="biological") out.labels.push({x:top+6, y:barY-6, t: nat==="unknown"?t("link type unknown"):PC_NATURE[nat].toLowerCase(), cls:"t-elabel", anchor:"start"});
  });
  if(n.more) out.labels.push({x:cx, y:y-6, t:tn(n.more,"+{n} other parent link — see profile","+{n} other parent links — see profile"), cls:"t-elabel"});
}

/* ---------- compose a view ---------- */
function rootsForFull(set){
  const ppl = Object.values(S.people).filter(p=>!set || set.has(p.id));
  const hasParentsIn = (id) => parentsOf(id).some(x=>!set || set.has(x.person.id));
  let roots = ppl.filter(p=>!hasParentsIn(p.id));
  roots = roots.filter(r=>!unionsOf(r.id).some(u=>(!set||set.has(u.partnerId)) && hasParentsIn(u.partnerId)));
  const sizeOf = (id)=>{ let n=0; const st=[id], s=new Set(); while(st.length){ const c=st.pop(); if(s.has(c)) continue; s.add(c); n++; childrenOf(c).forEach(x=>st.push(x.person.id)); } return n; };
  return roots.sort((a,b)=>sizeOf(b.id)-sizeOf(a.id) || byBirth(a.id,b.id)).map(r=>r.id);
}
function computeLayout(){
  const out = {nodes:[], edges:[], labels:[], toggles:[], title:""};
  const f = T.focusId && P(T.focusId) ? T.focusId : null;
  const mode = T.mode;
  if(!Object.keys(S.people).length) return null;
  const descFrom = (rootId, depth, extra={}) => { const ctx = {seen:new Set(), collapsed:T.collapsed, rootId, ...extra}; const u = descUnit(rootId, depth, ctx); measureDesc(u); return {u, ctx}; };

  if(mode==="descendants" || mode==="couple" || mode==="branch"){
    let rootId = f, extra = {}, depth = T.depthDown;
    if(mode==="couple"){ const r = S.rels[T.unionId]; if(!r) return {empty:"Choose a couple to show their children and grandchildren."}; rootId = r.aId; extra.onlyPartner = r.bId; out.title = `${nameById(r.aId)} & ${nameById(r.bId)}`; }
    if(mode==="branch"){ const b = S.branches[T.branchId]; if(!b) return {empty: Object.keys(S.branches).length ? "Choose a branch to show." : "No branches yet. Use “Branches” to define one by its founder."}; if(!P(b.founderId)) return {empty:"This branch's founder was deleted. Edit the branch to choose a new founder."}; rootId = b.founderId; depth = 99; out.title = b.name; }
    if(!rootId) return {empty:"Choose a person to start from."};
    const {u} = descFrom(rootId, depth, extra); placeDesc(u, 0, 0, out);
  } else if(mode==="ancestors"){
    if(!f) return {empty:"Choose a person to trace their ancestors."};
    const n = ancNode(f, T.depthUp, {seen:new Set([f]), ghosts:true}); measureAnc(n); placeAnc(n, 0, 0, out);
  } else if(mode==="family"){
    if(!f) return {empty:"Choose a person to centre the tree on."};
    const n = ancNode(f, T.depthUp, {seen:new Set([f]), ghosts:true}); measureAnc(n);
    const up = {nodes:[], edges:[], labels:[], toggles:[]}; placeAnc(n, 0, 0, up, true);
    const {u} = descFrom(f, T.depthDown); const down = {nodes:[], edges:[], labels:[], toggles:[]}; placeDesc(u, 0, 0, down);
    const dx = n.x - u.selfX;
    down.nodes.forEach(o=>o.x+=dx); down.toggles.forEach(o=>o.x+=dx); down.labels.forEach(o=>o.x+=dx);
    down.edges.forEach(e=>{ e.d = shiftPath(e.d, dx); });
    ["nodes","edges","labels","toggles"].forEach(k=>out[k].push(...up[k], ...down[k]));
  } else { // full
    const ids = rootsForFull(null); const ctx = {seen:new Set(), collapsed:T.collapsed}; let x = 0;
    for(const r of ids){ if(ctx.seen.has(r)) continue; ctx.rootId = r; const u = descUnit(r, 99, ctx); measureDesc(u); placeDesc(u, x, 0, out); x += u.w + CW*0.6; }
  }
  out.nodes.forEach(nd=>{ if(nd.pid===f) nd.focus = true; });
  const xs = out.nodes.map(n=>n.x), ys = out.nodes.map(n=>n.y);
  out.box = {x0:Math.min(...xs), y0:Math.min(...ys)-30, x1:Math.max(...xs)+CW, y1:Math.max(...ys)+CH+30};
  return out;
}
function shiftPath(d, dx){ return d.replace(/([MLH])(-?[\d.]+)/g, (m,c,n)=>c+(parseFloat(n)+dx)); }

/* ---------- render ---------- */
function wrapName(s, max=20){
  const words = s.split(/\s+/); const lines=[""]; for(const w of words){ const cur = lines[lines.length-1]; if((cur+" "+w).trim().length<=max) lines[lines.length-1]=(cur+" "+w).trim(); else lines.push(w); }
  if(lines.length>2){ lines[1] = (lines.slice(1).join(" ")).slice(0,max-1)+"…"; lines.length=2; }
  return lines.map(l=>l.length>max? l.slice(0,max-1)+"…" : l);
}
function cardSVG(nd, focusId, forExport){

      <rect class="bg" width="${CW}" height="${CH}" rx="6"/>

  }

    <rect class="bg" width="${CW}" height="${CH}" rx="6"/>
    <rect class="stripe" x="0" y="10" width="3" height="${CH-20}" rx="1.5"/>
    <circle class="mono" cx="34" cy="${CH/2}" r="21"/><text class="mono-t" x="34" y="${CH/2}">${esc(initials(p))}</text>
    ${lines.map((l,i)=>`<text class="nm" x="64" y="${ny+i*17}">${esc(l)}</text>`).join("")}
    <text class="yr${yl.conflict?" yr-warn":""}" x="64" y="${ny+lines.length*17+2}">${yl.conflict?"⚠ ":""}${esc(yl.text)}</text>
    ${kin?`<text class="lb" x="64" y="${CH-9}">${esc(kin.length>26?kin.slice(0,25)+"…":kin)}</text>`:""}

function treeContentSVG(L, forExport){
  const edges = L.edges.map(e=>`<path class="${e.cls}" d="${e.d}"/>`).join("");
  const labels = L.labels.map(l=>`<text class="${l.cls}" x="${l.x}" y="${l.y}" ${l.anchor?`text-anchor="${l.anchor}"`:""}>${esc(l.t)}</text>`).join("");
  const cards = L.nodes.map(n=>cardSVG(n, T.focusId, forExport)).join("");
  const toggles = forExport ? "" : L.toggles.map(t=>`<g class="t-tog" data-toggle="${t.pid}" transform="translate(${t.x},${t.y+12})" tabindex="0" role="button" aria-label="${esc(tg(t.collapsed?"Expand descendants of {name}":"Collapse descendants of {name}",{name:nameById(t.pid)}))}"><circle r="${t.collapsed?15:10}"/><text>${t.collapsed?"+"+t.hidden:"−"}</text></g>`).join("");
  return edges + labels + cards + toggles;
}

let svgEl = null;
function renderTreeCanvas(fit){
  const wrap = $("#canvasWrap"); if(!wrap) return;
  const L = computeLayout(); T.layout = L;
  if(!L || L.empty){
    wrap.innerHTML = `<div class="empty-tree"><div><h2>${!L? "No one in the tree yet" : "Nothing to show"}</h2><p class="muted">${!L? "Add the first person — yourself, or the oldest ancestor you know." : esc(L.empty)}</p>${!L?`<button class="btn primary" data-act="add-person">Add first person</button>`:""}</div></div>`;
    return;
  }
  wrap.innerHTML = `<svg id="treeSvg" role="group" aria-label="Family tree. Drag to pan, scroll or use plus and minus to zoom." tabindex="0"><g id="treeG">${treeContentSVG(L,false)}</g></svg>
    <div class="zoomctl"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit tree to screen">Fit</button></div>
    ${legendHTML()}`;
  svgEl = $("#treeSvg");
  bindTreeInteraction();
  if(fit || !T.hasView) fitTree(); else applyView();
  T.hasView = true;
}
function legendHTML(){
  const ln = (cls, label) => `<li><svg width="40" height="10"><path class="${cls}" d="M2,5 H38"/></svg>${label}</li>`;
  return `<div class="legend ${T.showLegend?"":"hidden"}" id="legend"><div class="row" style="justify-content:space-between"><b>Line styles</b><button class="link small" data-act="legend-off">Hide</button></div><ul>
   ${ln("t-edge","Biological, supported")}${ln("t-edge adopt","Adoptive")}${ln("t-edge step","Step, guardian or foster")}${ln("t-edge doubt","Unverified or family tradition")}${ln("t-couple","Marriage (label: m. year)")}${ln("t-couple partnership","Partnership")}
   <li><span class="warn" style="color:var(--brick);font-weight:700;font-size:12px;width:40px">⚠</span>Sources disagree about dates</li><li><span style="font-weight:700;width:40px;text-align:center">~</span>Year is approximate</li></ul></div>`;
}
function applyView(){ const g = $("#treeG"); if(!g) return; g.setAttribute("transform", `translate(${T.x},${T.y}) scale(${T.k})`); svgEl.classList.toggle("far", T.k < 0.5); }
function fitTree(){
  if(!svgEl || !T.layout || !T.layout.box) return; const b = T.layout.box; const W = svgEl.clientWidth || 800, H = svgEl.clientHeight || 600;
  const w = b.x1-b.x0+80, h = b.y1-b.y0+80; T.k = Math.min(W/w, H/h, 1.15); T.k = Math.max(T.k, 0.08);
  T.x = (W - (b.x1-b.x0)*T.k)/2 - b.x0*T.k; T.y = (H - (b.y1-b.y0)*T.k)/2 - b.y0*T.k; applyView();
}
function zoomAt(cx, cy, f){ const k2 = Math.min(3, Math.max(0.08, T.k*f)); f = k2/T.k; T.x = cx - (cx - T.x)*f; T.y = cy - (cy - T.y)*f; T.k = k2; applyView(); }
function centerOn(pid, highlight){
  const nd = T.layout && T.layout.nodes && T.layout.nodes.find(n=>n.pid===pid && !n.dup); if(!nd || !svgEl) return false;
  const W = svgEl.clientWidth, H = svgEl.clientHeight; if(T.k < 0.6) T.k = 0.85;
  T.x = W/2 - (nd.x + CW/2)*T.k; T.y = H/2 - (nd.y + CH/2)*T.k; applyView();
  if(highlight){ const el = svgEl.querySelector(`[data-pid="${pid}"]:not([data-dup])`); if(el){ el.classList.add("hl"); setTimeout(()=>el.classList.remove("hl"), 1600); el.focus({preventScroll:true}); } }
  return true;
}
function bindTreeInteraction(){
  const pts = new Map(); let moved = 0, start = null, pinch = null;
  svgEl.addEventListener("wheel", e=>{ e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015)); }, {passive:false});
  svgEl.addEventListener("pointerdown", e=>{ pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0; start = {x:e.clientX, y:e.clientY, tx:T.x, ty:T.y};
    if(pts.size===2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), k:T.k}; } });
  svgEl.addEventListener("pointermove", e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===2 && pinch){ const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y); const r = svgEl.getBoundingClientRect(); zoomAt((a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top, (pinch.k*d/pinch.d)/T.k); moved = 99; return; }
    const dx = e.clientX-start.x, dy = e.clientY-start.y; if(Math.abs(dx)+Math.abs(dy) > 4){ moved = 99; if(!svgEl.hasPointerCapture(e.pointerId)) svgEl.setPointerCapture(e.pointerId); svgEl.classList.add("dragging"); }
    if(moved){ T.x = start.tx + dx; T.y = start.ty + dy; applyView(); } });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; svgEl.classList.remove("dragging"); };
  svgEl.addEventListener("pointerup", up); svgEl.addEventListener("pointercancel", up);
  svgEl.addEventListener("click", e=>{ if(moved>4){ moved=0; return; } activateTreeTarget(e.target); });
  svgEl.addEventListener("keydown", e=>{
    if((e.key==="Enter"||e.key===" ") && e.target !== svgEl){ e.preventDefault(); activateTreeTarget(e.target); return; }
    const step = 60; const r = svgEl.getBoundingClientRect();
    const map = {ArrowLeft:[step,0], ArrowRight:[-step,0], ArrowUp:[0,step], ArrowDown:[0,-step]};
    if(map[e.key] && e.target===svgEl){ e.preventDefault(); T.x+=map[e.key][0]; T.y+=map[e.key][1]; applyView(); }
    if(e.key==="+"||e.key==="="){ zoomAt(r.width/2, r.height/2, 1.2); } if(e.key==="-"){ zoomAt(r.width/2, r.height/2, 1/1.2); } if(e.key==="0"){ fitTree(); }
  });
  $(".zoomctl").addEventListener("click", e=>{ const z = e.target.closest("[data-z]"); if(!z) return; const r = svgEl.getBoundingClientRect(); if(z.dataset.z==="in") zoomAt(r.width/2,r.height/2,1.25); else if(z.dataset.z==="out") zoomAt(r.width/2,r.height/2,0.8); else fitTree(); });
}
function activateTreeTarget(t){
  const tog = t.closest("[data-toggle]"); if(tog){ const id = tog.dataset.toggle; T.collapsed.has(id)? T.collapsed.delete(id) : T.collapsed.add(id); renderTreeCanvas(false); return; }
  const gh = t.closest("[data-ghost]"); if(gh){ openAddRelative(gh.dataset.ghost, gh.dataset.sex==="male"?"father":gh.dataset.sex==="female"?"mother":"parent"); return; }
  const c = t.closest("[data-pid]"); if(!c) return;
  if(c.dataset.dup){ centerOn(c.dataset.pid, true); return; }
  go("person", c.dataset.pid);
}

function buildExportSVG(){

async function exportTree(fmt){
  const svg = buildExportSVG(); if(!svg){ toast("Nothing to export — the tree view is empty."); return; }
  const base = (archiveTitle()+"-"+T.mode+"-tree").replace(/[^\w\-]+/g,"-").toLowerCase();
  if(fmt==="svg") return saveFile(base+".svg", new Blob([svg],{type:"image/svg+xml"}));
  const img = new Image(); const url = URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  try{
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("The tree image could not be drawn.")); img.src=url; });
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const scale = Math.min(3, Math.sqrt(60e6/(w*h))); // stay under typical canvas limits
    const c = document.createElement("canvas"); c.width = Math.round(w*scale); c.height = Math.round(h*scale);
    const ctx = c.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    const blob = await new Promise(r=>c.toBlob(r,"image/png"));
    if(!blob) throw new Error("This tree is too large for a PNG in this browser. Export SVG instead — it stays sharp at any size.");
    await saveFile(base+".png", blob);
  }catch(e){ toast(e.message); } finally { URL.revokeObjectURL(url); }
}

  add(ppl.filter(p=>unresolvedConflicts(p.id).length), "person has conflicting records that need research.", "people have conflicting records that need research.");
  add(ppl.filter(p=>{ const v=vital(p.id,"birth"); return !v.records.length || v.records.every(r=>!r.date||r.date.mode==="unknown"); }), "person has an unknown birth date.", "people have unknown birth dates.");

function profileHTML(pid){

/* =====================================================================
   SEARCH — find any person to study them.
   Matches every recorded name form, Latin ↔ Cyrillic, with or without
   o‘ / g‘ apostrophes, small typos, and birth/death years.
   ===================================================================== */
const CYR = {"а":"a","б":"b","в":"v","г":"g","ғ":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","қ":"q","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ў":"o","ф":"f","х":"x","ҳ":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ь":"","ы":"i","э":"e","ю":"yu","я":"ya","і":"i"};
function translit(s){ return [...String(s||"").toLowerCase()].map(c=>CYR[c] ?? c).join(""); }
/* loose key: script- and spelling-tolerant (Qodirov ~ Кадыров ~ Kodirov, Farrukh ~ Farrux) */
function skel(s){ return fold(translit(s)).replace(/kh/g,"x").replace(/q/g,"k").replace(/x/g,"h").replace(/w/g,"v").replace(/[^\p{L}\p{N}]+/gu," ").trim(); }
const toks = (s) => skel(s).split(" ").filter(Boolean);
function lev(a, b, max){
  if(Math.abs(a.length-b.length) > max) return max+1;
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur = [i]; let rowMin = i;
    for(let j=1;j<=b.length;j++){ cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); rowMin = Math.min(rowMin, cur[j]); }
    if(rowMin > max) return max+1; prev = cur;
  }
  return prev[b.length];
}
function tokScore(q, w){
  if(q===w) return 3;
  if(q.length>=2 && w.startsWith(q)) return 2.5;
  if(q.length>=4 && q[0]===w[0]){ const d = lev(q, w, q.length>=7 ? 2 : 1); if(d <= (q.length>=7 ? 2 : 1)) return 1.5; }
  return 0;
}
function personYears(p){
  const ys = new Set();
  ["birth","death"].forEach(tp=>vitalRecords(p.id,tp).forEach(r=>{ const rg = dRange(r.date); if(rg && isFinite(rg[0]) && isFinite(rg[1])) for(let y=rg[0]; y<=rg[1] && y-rg[0]<12; y++) ys.add(String(y)); else if(r.date && r.date.y) ys.add(String(r.date.y)); }));
  return ys;
}
function personPlaces(p){ return [...new Set(eventsOf(p.id).flatMap(e=>[e.placeId, e.toPlaceId]).concat(unionsOf(p.id).map(u=>u.rel.startPlaceId)).filter(Boolean).map(placeName))]; }
/* returns null (no match) or {score, via} */
function searchScore(p, q){
  const qt = toks(q); if(!qt.length) return {score:0, via:null};
  const variants = nameVariants(p).map(v=>({v, t:toks(v)}));
  const years = personYears(p); const ptoks = personPlaces(p).flatMap(toks);
  let total = 0; const hitCount = new Map();
  for(const x of qt){
    let best = 0, bestV = null;
    if(/^\d{4}$/.test(x)){ if(years.has(x)) best = 2; }
    else for(const vv of variants) for(const w of vv.t){ const s = tokScore(x, w); if(s > best){ best = s; bestV = vv.v; } }
    if(!best && x.length>=3 && ptoks.some(w=>tokScore(x,w)>=2.5)) best = 1;
    if(!best) return null;
    total += best; if(bestV) hitCount.set(bestV, (hitCount.get(bestV)||0)+1);
  }
  const via = [...hitCount.entries()].sort((a,b)=>b[1]-a[1])[0];
  return {score: total/qt.length, via: via ? via[0] : null};
}
function matchesName(p, q){ return !String(q||"").trim() || !!searchScore(p, q); }

/* ---------- search state & filters ---------- */
R.S = { q:"", yFrom:"", yTo:"", place:"", sex:"", living:"", branch:"", flag:"" };
function filtersActive(){ const f = R.S; return !!(f.yFrom || f.yTo || f.place || f.sex || f.living || f.branch || f.flag); }
function runSearch(){
  const f = R.S; const q = f.q.trim();
  if(!q && !filtersActive()) return null;
  const y1 = parseInt(f.yFrom,10), y2 = parseInt(f.yTo,10);
  const bm = f.branch ? branchMembers(f.branch) : null;
  const out = [];
  for(const p of Object.values(S.people)){
    const m = q ? searchScore(p, q) : {score:0, via:null}; if(!m) continue;
    if(f.sex && p.sex!==f.sex) continue;
    if(f.living && p.living!==f.living) continue;
    if(bm && !bm.has(p.id)) continue;
    if(Number.isFinite(y1) || Number.isFinite(y2)){
      const rs = vitalRecords(p.id,"birth").map(r=>dRange(r.date)).filter(Boolean);
      const lo = Number.isFinite(y1)? y1 : -Infinity, hi = Number.isFinite(y2)? y2 : Infinity;
      if(!rs.some(r=>r[0] <= hi && r[1] >= lo)) continue;
    }
    if(f.place){ const pq = skel(f.place); if(!personPlaces(p).some(n=>skel(n).includes(pq))) continue; }
    if(f.flag==="conflict" && !unresolvedConflicts(p.id).length) continue;
    if(f.flag==="noparents" && parentsOf(p.id).length) continue;
    if(f.flag==="nosource" && !eventsOf(p.id).some(e=>!citationsOf(e).length)) continue;
    if(f.flag==="nobirth" && vital(p.id,"birth").records.some(r=>r.date && r.date.mode!=="unknown")) continue;
    out.push({p, ...m});
  }
  return out.sort((a,b)=>b.score-a.score || nameOf(a.p).localeCompare(nameOf(b.p)));
}

  if(!b.records.some(r=>r.date && r.date.mode!=="unknown")) add(t("Birth date is unknown."), btnEv("birth", t("Add")));
  if(!b.records.some(r=>r.placeId)) add(t("Birthplace is unknown."), b.records.length ? "" : btnEv("birth", t("Add")));
  const pars = parentsOf(pid);
  if(!pars.some(x=>x.person.sex==="male")) add(t("Father is not recorded."), `<button class="btn sm" data-act="add-rel" data-id="${pid}" data-rel="father">${t("Add")}</button>`);
  if(!pars.some(x=>x.person.sex==="female")) add(t("Mother is not recorded."), `<button class="btn sm" data-act="add-rel" data-id="${pid}" data-rel="mother">${t("Add")}</button>`);
  if(p.living==="unknown") add(t("It is not known whether this person is living."), `<button class="btn sm" data-act="edit-person" data-id="${pid}">${t("Edit")}</button>`);
  if(p.living==="deceased" && !d.records.length) add(t("No record of death yet."), btnEv("death", t("Add")));
  const nos = eventsOf(pid).filter(e=>!citationsOf(e).length).length; if(nos) add(tn(nos, "{n} fact has no source yet.", "{n} facts have no source yet."));
  const weak = [...pars.map(x=>x.rel), ...unionsOf(pid).map(u=>u.rel)].filter(r=>doubtful(r.status)).length; if(weak) add(tn(weak, "{n} family link still needs checking.", "{n} family links still need checking."));

}
/* =====================================================================
   ACCOUNTS — many people can each keep their own archive.
   Registry + archives live in the viewer's private claude.ai space when
   available, otherwise in this browser. Passwords are stored only as a
   salted PBKDF2 hash. This is a simple gate for a shared device, not
   internet-grade authentication (that needs a server — later phase).
   ===================================================================== */
const ACC = { ready:false, mode:null, db:null, me:null, ref:null, list:[], cur:null, err:null };
const ACC_KEY = "family-archive:accounts", SESSION_KEY = "family-archive:session", LEGACY_LOCAL = "family-archive:mine:v1";
let memSession = null;

const hex = (u8) => [...u8].map(b=>b.toString(16).padStart(2,"0")).join("");
const unhex = (h) => new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
async function hashPw(pw, salt, algo){
  const want = algo || (window.crypto && crypto.subtle ? "pbkdf2" : "fnv");
  if(want==="pbkdf2"){
    if(!(window.crypto && crypto.subtle)) throw new Error(t("This browser can't check this password here. Open the archive in the same browser where the account was created."));
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:unhex(salt), iterations:120000}, key, 256);
    return {algo:"pbkdf2", hash:hex(new Uint8Array(bits))};
  }
  let h1 = 2166136261>>>0, h2 = 5381; const s = salt+":"+pw;
  for(let r=0;r<4000;r++) for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619)>>>0; h2 = (Math.imul(h2, 33) ^ c ^ r)>>>0; }
  return {algo:"fnv", hash:h1.toString(16)+h2.toString(16)};
}
function newSalt(){ const u = new Uint8Array(16); (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(u) : u.forEach((_,i)=>u[i]=Math.random()*256|0); return hex(u); }
const userKey = (u) => fold(String(u||"").trim());

async function openAccountStore(){
  try{
    if(window.claude && window.claude.use){
      const db = await window.claude.use("db");
      const user = db ? await window.claude.use("user") : null;
      const me = user ? await user.id() : null;
      if(db && me){
        const ref = db.doc(`data/users/${me}/accounts`);
        const snap = await ref.get();
        let data = snap.exists ? snap.data() : null;
        if(!data){ await ref.set({list:[]}); data = {list:[]}; }   // also proves we may write here
        Object.assign(ACC, {mode:"db", db, me, ref, list: (data.list||[]).map(x=>({...x}))});
      }
    }
  }catch(e){ console.warn("claude.ai storage unavailable, using this browser", e); ACC.mode = null; }
  if(!ACC.mode){
    try{ localStorage.setItem("family-archive:probe","1"); localStorage.removeItem("family-archive:probe");
      ACC.mode = "local"; const v = localStorage.getItem(ACC_KEY); ACC.list = v ? (JSON.parse(v).list||[]) : []; }
    catch(e){ ACC.mode = "memory"; ACC.list = []; }
  }
  let sid = null; try{ sid = JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); }catch(e){ sid = memSession; }
  ACC.cur = (sid && ACC.list.find(a=>a.id===sid.id)) || null;
  ACC.ready = true;
}
async function saveRegistry(){
  const list = ACC.list.map(a=>({...a}));
  if(ACC.mode==="db") await ACC.ref.set({list});
  else if(ACC.mode==="local") localStorage.setItem(ACC_KEY, JSON.stringify({list}));
}
function setSession(a){ memSession = a ? {id:a.id} : null; try{ if(a) localStorage.setItem(SESSION_KEY, JSON.stringify({id:a.id})); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
function accountBackend(a){
  if(ACC.mode==="db") return DbBackend(ACC.db, ACC.me, a.store);
  if(ACC.mode==="local") return LocalBackend(a.store);
  return MemoryBackend("Not saved — this browser blocks storage. Download a backup before you close the page.");
}
async function legacyHasData(){
  try{
    if(ACC.mode==="db") return await DbBackend(ACC.db, ACC.me, "archive").hasData();
    if(ACC.mode==="local"){ const v = JSON.parse(localStorage.getItem(LEGACY_LOCAL)||"null"); return !!(v && v.people && Object.keys(v.people).length); }
  }catch(e){}
  return false;
}
function validUsername(u){
  u = String(u||"").trim();
  if(u.length < 3) return t("The username must be at least 3 characters.");
  if(u.length > 30) return t("The username can be at most 30 characters.");
  if(!/^[\p{L}\p{N}._-]+$/u.test(u)) return t("Use only letters, numbers, dot, dash or underscore in the username — no spaces.");
  return null;
}
async function registerAccount(username, pw){
  username = String(username||"").trim();
  const e = validUsername(username); if(e) return {err:e};
  if(!pw) return {err:t("Enter a password.")};
  if(ACC.list.some(a=>a.key===userKey(username))) return {err:t("This username is already taken on this device. Sign in, or choose another name.")};
  const salt = newSalt(); const h = await hashPw(pw, salt);
  const id = uid("acct");
  let store = ACC.mode==="db" ? "a_"+id : "family-archive:acct:"+id, adopted = false;
  if(!ACC.list.length && await legacyHasData()){ store = ACC.mode==="db" ? "archive" : LEGACY_LOCAL; adopted = true; }
  const a = {id, username, key:userKey(username), salt, algo:h.algo, hash:h.hash, store, created:nowISO()};
  ACC.list.push(a);
  try{ await saveRegistry(); }catch(x){ ACC.list.pop(); return {err:t("The account could not be saved ({code}).",{code:x.code||x.message})}; }
  return {account:a, adopted};
}
async function checkLogin(username, pw){
  const a = ACC.list.find(x=>x.key===userKey(username));
  if(!a) return {err:"no_user"};
  let h; try{ h = await hashPw(pw, a.salt, a.algo); }catch(x){ return {err:x.message}; }
  if(h.hash!==a.hash) return {err:"bad_pw"};
  return {account:a};
}
async function changePassword(a, oldPw, newPw){
  const c = await checkLogin(a.username, oldPw); if(c.err) return t("The current password is not correct.");
  if(!newPw) return t("Enter a new password.");
  const salt = newSalt(); const h = await hashPw(newPw, salt);
  Object.assign(a, {salt, algo:h.algo, hash:h.hash}); await saveRegistry(); return null;
}

async function deleteAccount(a){

  ACC.list = ACC.list.filter(x=>x.id!==a.id); await saveRegistry();
  await logout(); toast(t("The account and its archive were deleted."));
}

function openModal({title, sub="", body, size="", primary="Save", onPrimary, extra=null, onOpen}){
  const prev = document.activeElement;
  const root = document.createElement("div"); root.className = "scrim";
  root.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><div><h2 id="mTitle">${esc(title)}</h2>${sub?`<p>${sub}</p>`:""}</div><button class="xbtn" data-close aria-label="Close">×</button></header>
    <div class="body">${body}<p class="err" id="mErr" role="alert" hidden></p></div>
    <footer>${extra?`<button class="btn ghost danger" data-extra>${esc(extra.label)}</button>`:"<span></span>"}<div class="row"><button class="btn" data-close>Cancel</button>${primary?`<button class="btn primary" data-primary>${esc(primary)}</button>`:""}</div></footer></div>`;
  document.body.appendChild(root);
  const close = () => { root.remove(); if(prev && prev.focus && document.contains(prev)) prev.focus(); };
  const fail = (msg) => { const e = $("#mErr", root); e.textContent = msg; e.hidden = false; e.scrollIntoView({block:"nearest"}); };
  root.addEventListener("click", async e=>{
    if(e.target===root || e.target.closest("[data-close]")) return close();
    if(e.target.closest("[data-primary]")){ const btn = e.target.closest("[data-primary]"); btn.disabled = true; try{ const err = await onPrimary(root); if(err) fail(err); else close(); } catch(x){ console.error(x); fail("Something went wrong: "+x.message); } finally{ btn.disabled = false; } }
    if(e.target.closest("[data-extra]")){ const err = await extra.fn(root, close); if(err) fail(err); }
  });
  root.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ e.stopPropagation(); close(); }
    if(e.key==="Tab"){ const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(x=>!x.disabled && x.offsetParent!==null); if(!f.length) return; const a=f[0], z=f[f.length-1]; if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
  });
  if(onOpen) onOpen(root);
  const first = $("input:not([type=radio]):not([type=checkbox]):not(.sr),select,textarea", $(".body", root)) || $("[data-primary]", root);
  setTimeout(()=>first && first.focus(), 20);
  return {root, close, fail};
}

/* fuzzy date widget */
function dateField(p, dt, label){
  dt = dt || {mode:"unknown"}; const mOpts = (v)=>`<option value="">Month</option>`+MON.map((m,i)=>`<option value="${i+1}" ${v===i+1?"selected":""}>${m}</option>`).join("");
  return `<div class="fld"><span>${label}</span><div class="fdate m-${dt.mode}" data-date="${p}">
    <select data-k="mode" aria-label="${esc(t("{label}: how precise",{label:t(label)}))}">${opt(DATE_MODES, dt.mode)}</select>
    <input class="p1 dd" data-k="d" inputmode="numeric" placeholder="Day" aria-label="Day" value="${dt.d||""}">
    <select class="p1 mm" data-k="m" aria-label="Month">${mOpts(dt.m)}</select>
    <input class="p1" data-k="y" inputmode="numeric" placeholder="Year" aria-label="Year" value="${dt.y||""}">
    <div class="two"><span class="and">and</span><input data-k="d2" inputmode="numeric" placeholder="Day" aria-label="End day" value="${dt.d2||""}"><select data-k="m2" aria-label="End month">${mOpts(dt.m2)}</select><input data-k="y2" inputmode="numeric" placeholder="Year" aria-label="End year" value="${dt.y2||""}"></div>
    <input class="txt" data-k="text" placeholder="As written in the source (optional), e.g. “the spring after the flood”" aria-label="Date as written in the source" value="${esc(dt.text||"")}">
  </div></div>`;
}
function readDate(root, p){
  const w = $(`[data-date="${p}"]`, root); if(!w) return {mode:"unknown"};
  const g = (k)=>{ const el = $(`[data-k="${k}"]`, w); return el ? el.value.trim() : ""; };
  const n = (k)=>{ const v = parseInt(g(k),10); return Number.isFinite(v) ? v : null; };
  const mode = g("mode"); const dt = {mode};
  if(mode!=="unknown"){ dt.y = n("y"); if(mode!=="year"){ dt.m = n("m"); if(mode!=="month") dt.d = n("d"); } if(mode==="between"){ dt.y2 = n("y2"); dt.m2 = n("m2"); dt.d2 = n("d2"); } }
  if(g("text")) dt.text = g("text");
  Object.keys(dt).forEach(k=>{ if(dt[k]===null) delete dt[k]; });
  return dt;
}

function readCites(root){
  const out = []; let err = null;
  $$("[data-cites] .cite-row", root).forEach(r=>{
    let sid = $('[data-c="src"]', r).value; const detail = $('[data-c="detail"]', r).value.trim();
    if(sid==="__new"){ const nt = $('[data-c="ntitle"]', r).value.trim(); if(!nt){ err = t("Give the new source a title, or remove that citation."); return; } r._new = {title:nt, type:$('[data-c="ntype"]', r).value}; }
    else if(!sid) return;
    out.push({row:r, sourceId:sid, detail});
  });
  if(err) return {err};
  return {commit: () => out.map(c=>{ if(c.sourceId==="__new"){ const s = put("sources", {id:uid("src"), ...c.row._new, date:{mode:"unknown"}}); c.sourceId = s.id; } return {sourceId:c.sourceId, detail:c.detail}; })};
}

        const nat = val(root,"nature"); if(nat==="biological" && parentsOf(pid).filter(x=>x.rel.nature==="biological").length>=2) return t("{name} already has two biological parents recorded. Record this person as another kind of parent, or edit the existing links first.",{name:nameOf(p)});
      }
      if(relation==="child" && !newPerson){ if(isAncestor(other, pid)) return t("{a} is an ancestor of {b} — they can’t also be their child.",{a:nameById(other), b:nameOf(p)}); if(childrenOf(pid).some(x=>x.person.id===other)) return "Already recorded as a child."; }
      if(relation==="partner" && !newPerson && unionsOf(pid).some(u=>u.partnerId===other)) return "These two are already recorded as partners. Edit the existing union instead.";
      let us, ue;
      if(relation==="partner"){ us = readDate(root,"ustart"); let e = validateDate(us); if(e) return t("Union date — {e}",{e}); ue = readDate(root,"uendd"); e = validateDate(ue); if(e) return t("End date — {e}",{e}); }
      // commit
      if(newPerson){ put("people", newPerson); const bp = val(root,"nbplace"); if(nb.mode!=="unknown" || bp) put("events", {id:uid("ev"), type:"birth", date:nb, placeId:placeIdFor(bp), participants:[{personId:newPerson.id, role:"principal"}], status:val(root,"nbstatus"), citations:[], title:"", description:""}); }
      const citations = cites.commit();
      if(isParent) put("rels", {id:uid("r"), type:"parentChild", parentId:other, childId:pid, nature:val(root,"nature"), status, citations, notes:""});
      if(relation==="child"){ put("rels", {id:uid("r"), type:"parentChild", parentId:pid, childId:other, nature:val(root,"nature"), status, citations, notes:""});
        const op = val(root,"otherParent"); if(op && !parentsOf(other).some(x=>x.person.id===op)) put("rels", {id:uid("r"), type:"parentChild", parentId:op, childId:other, nature:val(root,"nature"), status, citations:[], notes:""}); }
      if(relation==="partner") put("rels", {id:uid("r"), type:"union", aId:pid, bId:other, unionType:val(root,"utype"), start:us, startPlaceId:placeIdFor(val(root,"uplace")), endReason:val(root,"uend"), endDate:ue, status, citations});
      if(relation==="sibling"){
        const shared = $$('[name="sharedParent"]:checked', root).map(x=>x.value);
        if(shared.length) shared.forEach(par=>{ if(!parentsOf(other).some(x=>x.person.id===par)){ const src = parentsOf(pid).find(x=>x.person.id===par); put("rels", {id:uid("r"), type:"parentChild", parentId:par, childId:other, nature: src? src.rel.nature : "biological", status, citations: citations, notes:""}); } });
        else put("rels", {id:uid("r"), type:"sibling", aId:pid, bId:other, nature:val(root,"sibNature"), status, citations});
      }
      render(); toast(t("Added {name} as "+REL_WORD[relation]+".",{name:nameById(other)}));
    }});
}

  setTimeout(()=>{ document.addEventListener("click", outside, true); $("button", m).focus(); }, 0);
